<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RefChe — ремонт і діагностика рефрижераторів у Чернівцях. Холодильні установки для вантажівок різних типів."
    />
    <meta name="theme-color" content="#4aa8d8" />
    <script>
      // Застосувати збережену тему до першого малювання (без миготіння)
      try {
        var t = localStorage.getItem('refche-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/cold.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap&subset=cyrillic"
      rel="stylesheet"
    />
    <title>RefChe — ремонт рефрижераторів у Чернівцях</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
